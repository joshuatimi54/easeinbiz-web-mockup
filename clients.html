<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clients · Easeinbiz</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{border:"hsl(var(--border))",background:"hsl(var(--background))",foreground:"hsl(var(--foreground))",primary:{DEFAULT:"hsl(var(--primary))",foreground:"hsl(var(--primary-foreground))"},muted:{DEFAULT:"hsl(var(--muted))",foreground:"hsl(var(--muted-foreground))"},card:{DEFAULT:"hsl(var(--card))",foreground:"hsl(var(--card-foreground))"}},fontFamily:{display:["Sora","sans-serif"],body:["Inter","sans-serif"]}}}}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/theme.css">
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="font-body antialiased">
<div class="flex h-screen overflow-hidden">
  <div id="sidebar-mount"></div>
  <main class="flex-1 overflow-y-auto min-w-0">
    <div id="topbar-mount"></div>
    <div class="p-3 sm:p-6 max-w-[1600px] mx-auto space-y-5">
      <div id="hdr"></div>
      <div class="relative w-full sm:w-72">
        <i data-lucide="search" class="h-3.5 w-3.5 absolute left-2.5 top-2.5 text-muted-foreground"></i>
        <input placeholder="Search clients..." class="w-full text-sm border rounded-md pl-8 pr-3 py-1.5" style="border-color:hsl(var(--border))">
      </div>
      <div class="eb-card eb-shadow-sm p-0"><div id="clients-table"></div></div>
    </div>
  </main>
</div>
<script src="assets/js/shell.js" data-active="clients" data-title="Clients"></script>
<script src="assets/js/components.js"></script>
<script>
ebPageHeader('hdr', { title: 'Clients', subtitle: 'Staff and admin users who manage client accounts.', actions: [{ label: 'Invite Client', icon: 'plus', primary: true }] });
ebTable('clients-table', {
  columns: ['Name','Email','Role','Companies','Joined',''],
  rows: [
    [ebAvatar('MO',7)+' <span class="font-medium ml-2">Maya Okoye</span>', 'maya@acmeretail.com', ebPill('blue','Client'), '2', 'Jan 14, 2026', '<button class="text-muted-foreground hover:text-foreground"><i data-lucide="more-horizontal" class="h-4 w-4"></i></button>'],
    [ebAvatar('TE',7)+' <span class="font-medium ml-2">Tunde Eze</span>', 'tunde@bluewave.co', ebPill('blue','Client'), '1', 'Feb 2, 2026', '<button class="text-muted-foreground hover:text-foreground"><i data-lucide="more-horizontal" class="h-4 w-4"></i></button>'],
    [ebAvatar('RN',7)+' <span class="font-medium ml-2">Rita Nwosu</span>', 'rita@northgate.com', ebPill('blue','Client'), '1', 'Mar 21, 2026', '<button class="text-muted-foreground hover:text-foreground"><i data-lucide="more-horizontal" class="h-4 w-4"></i></button>'],
    [ebAvatar('KP',7)+' <span class="font-medium ml-2">Kunle Peters</span>', 'kunle@driftwood.io', ebPill('gray','Invited'), '0', '—', '<button class="text-muted-foreground hover:text-foreground"><i data-lucide="more-horizontal" class="h-4 w-4"></i></button>'],
  ]
});
</script>
</body>
</html>
