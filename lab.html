<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Lab · Easeinbiz</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{border:"hsl(var(--border))",background:"hsl(var(--background))",foreground:"hsl(var(--foreground))",primary:{DEFAULT:"hsl(var(--primary))",foreground:"hsl(var(--primary-foreground))"},muted:{DEFAULT:"hsl(var(--muted))",foreground:"hsl(var(--muted-foreground))"},card:{DEFAULT:"hsl(var(--card))",foreground:"hsl(var(--card-foreground))"}},fontFamily:{display:["Sora","sans-serif"],body:["Inter","sans-serif"]}}}}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/theme.css">
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="font-body antialiased">
<div class="flex h-screen overflow-hidden">
  <div id="sidebar-mount"></div>
  <main class="flex-1 overflow-y-auto min-w-0">
    <div id="topbar-mount"></div>
    <div class="p-3 sm:p-6 max-w-[1600px] mx-auto space-y-6">
      <div class="flex items-center justify-between flex-wrap gap-3">
        <div>
          <div class="flex items-center gap-2"><i data-lucide="flask-conical" class="h-5 w-5" style="color:hsl(var(--primary))"></i><h1 class="text-2xl font-bold tracking-tight font-display">The Lab</h1></div>
          <p class="text-sm text-muted-foreground mt-1">Your personal thinking space — capture ideas one notebook at a time.</p>
        </div>
        <a href="lab-notebook.html" class="inline-flex items-center gap-1.5 rounded-md text-white text-sm font-medium px-3.5 py-2" style="background:hsl(var(--primary))"><i data-lucide="plus" class="h-4 w-4"></i>New Notebook</a>
      </div>

      <div>
        <p class="text-xs font-semibold text-muted-foreground uppercase tracking-wide mb-3">My notebooks</p>
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4" id="notebooks"></div>
      </div>
    </div>
  </main>
</div>
<script src="assets/js/shell.js" data-active="lab" data-title="The Lab"></script>
<script>
var nbs = [
  { title:'Q4 Campaign Ideas', desc:'Brainstorm for the holiday push', color:'#0077B5', updated:'2 days ago' },
  { title:'New service line concepts', desc:'Exploring payroll + finance bundles', color:'#FFA500', updated:'5 days ago' },
  { title:'Client retention playbook', desc:'', color:'#0FA36B', updated:'1 week ago' },
  { title:'Brand refresh notes', desc:'Loose thoughts from the workshop', color:'#1A6E9E', updated:'2 weeks ago' },
];
document.getElementById('notebooks').innerHTML = nbs.map(function (n) {
  return '<a href="lab-notebook.html" class="eb-card eb-shadow-sm overflow-hidden hover:shadow transition-all block">' +
    '<div class="h-20" style="background:' + n.color + '"></div>' +
    '<div class="p-4"><h3 class="font-display font-semibold text-sm truncate">' + n.title + '</h3>' +
    (n.desc ? '<p class="text-xs text-muted-foreground truncate mt-0.5">' + n.desc + '</p>' : '') +
    '<p class="text-[11px] text-muted-foreground mt-3">' + n.updated + '</p></div></a>';
}).join('');
</script>
</body>
</html>
