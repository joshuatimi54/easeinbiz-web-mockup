<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>No Second Guessing — Easeinbiz</title><link rel="stylesheet" href="assets/css/theme.css"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}body{margin:0;background:#071b27;color:#fff;font-family:Inter,sans-serif;overflow:hidden}.film{height:100vh;position:relative;background:radial-gradient(circle at 50% 20%,#12384b,#071b27 65%);display:grid;place-items:center}.browser{width:min(88vw,760px);background:#f4f7f9;border-radius:18px;overflow:hidden;box-shadow:0 30px 90px #0008;transform-origin:center}.chrome{height:34px;background:#fff;display:flex;align-items:center;gap:6px;padding:0 12px}.dot{width:7px;height:7px;border-radius:50%;background:#c7d2d8}.address{margin-left:10px;height:20px;border-radius:6px;background:#edf2f5;flex:1}.screen{padding:32px;background:#f4f7f9;min-height:560px;color:#1a2830}.brand{font:700 13px Sora;color:#0077b5}.hero h1{font:800 clamp(26px,4vw,46px)/1.05 Sora;color:#0b2c3d;margin:45px 0 12px}.hero p{color:#64757f}.audit-input{margin-top:28px;display:flex;gap:8px;background:#fff;padding:7px;border-radius:13px;box-shadow:0 8px 25px #0b2c3d12}.audit-input input{border:1px solid #dfe7ec;border-radius:9px;padding:15px;flex:1;font-size:14px}.audit-input button,.action{border:0;border-radius:9px;background:#0077b5;color:#fff;padding:0 18px;font-weight:700}.trust{font-size:12px;color:#64757f;margin-top:10px}.caption{position:fixed;left:50%;bottom:8vh;transform:translateX(-50%);font:800 clamp(22px,4vw,46px)/1.08 Sora;text-align:center;width:min(92vw,850px);text-shadow:0 3px 20px #0009}.hidden{display:none!important}.pulse{animation:pulse 1s ease-in-out infinite}@keyframes pulse{50%{box-shadow:0 0 0 10px #0077b522}}.stage{padding:12px 0;border-bottom:1px solid #e9eff3;opacity:.28;transition:.35s}.stage.on{opacity:1}.check{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#e8f4fa;color:#0077b5;margin-right:9px}.profile,.finding,.creative{background:#fff;border-radius:14px;padding:22px;box-shadow:0 8px 30px #0b2c3d14;margin-top:24px}.finding{transform:translateY(22px) rotate(1deg);opacity:0}.finding.show{animation:deal .55s cubic-bezier(.34,1.56,.64,1) forwards}@keyframes deal{to{transform:none;opacity:1}}.fix{border-left:4px solid #ffa500;box-shadow:0 0 24px #ffa50022}.audience{display:flex;align-items:center;justify-content:center;min-height:320px;position:relative}.pin{font-size:58px;animation:drop .7s cubic-bezier(.34,1.56,.64,1)}@keyframes drop{from{transform:translateY(-120px);opacity:0}}.tags{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.tag{padding:7px 11px;background:#e8f4fa;color:#005793;border-radius:999px;font-size:12px}.creative{transform-style:preserve-3d;transition:transform .8s cubic-bezier(.2,.7,.2,1)}.flip{transform:rotateY(180deg)}.creative-inner{transition:opacity .3s}.launch{min-height:320px;display:grid;place-items:center;text-align:center}.icons{display:flex;gap:32px;font-size:34px}.ray{animation:ray 1s ease-out infinite}@keyframes ray{50%{transform:scale(1.18);opacity:.65}}.counter{font:800 28px Sora;color:#0077b5;margin-top:22px}.end{display:grid;place-items:center;text-align:center;height:100%}.end h1{font:800 clamp(34px,6vw,68px)/1 Sora;color:#0b2c3d}.end small{color:#64757f}.progress{position:fixed;top:0;left:0;height:3px;background:#0077b5;width:0;transition:width .25s}.controls{position:fixed;right:18px;top:18px;z-index:5}.controls button{background:#ffffff18;border:1px solid #ffffff33;color:#fff;padding:8px 12px;border-radius:8px;cursor:pointer}@media(max-width:600px){.browser{width:94vw}.screen{min-height:650px;padding:22px}.caption{bottom:5vh}.hero h1{margin-top:25px}}
</style></head><body><div class="film"><div class="progress" id="progress"></div><div class="controls"><button onclick="restart()">Restart</button></div><div class="browser"><div class="chrome"><i class="dot"></i><i class="dot"></i><i class="dot"></i><div class="address"></div></div><div class="screen" id="screen"></div></div><div class="caption" id="caption"></div></div><script>
const screen=document.getElementById('screen'),cap=document.getElementById('caption'),progress=document.getElementById('progress');let timers=[];const wait=(ms,fn)=>timers.push(setTimeout(fn,ms));function setCap(t){cap.textContent=t}function home(){screen.innerHTML=`<div class="brand">Easeinbiz · AUDIT AI</div><div class="hero"><h1>Your business has problems<br>you can't see.</h1><p>Paste your website or social handle. Audit AI starts reading.</p><div class="audit-input"><input id="url" value="" placeholder="yourbusiness.com or @yourhandle"><button onclick="start()">Audit</button></div><div class="trust">Free · No account needed · Results in about a minute</div></div>`;setCap("Your business has problems you can't see.");wait(900,()=>{let i=document.getElementById('url'),v='atelierleather.com';let n=0;let type=setInterval(()=>{i.value=v.slice(0,++n);if(n===v.length)clearInterval(type)},45);wait(1600,start)})}function start(){screen.innerHTML=`<div class="brand">AUDIT AI <span style="color:#64757f;font-weight:500">atelierleather.com</span></div><div class="profile pulse" style="margin-top:30px"><b>Reading your business…</b><div id="stages"></div></div>`;setCap('No account needed.');let labels=['Reading your site','Understanding what you sell','Checking your socials','Scoring'];labels.forEach((x,i)=>wait(i*850,()=>{document.getElementById('stages').insertAdjacentHTML('beforeend',`<div class="stage on"><span class="check">✓</span>${x} ✓</div>`)}));wait(3400,findings)}function findings(){setCap('Watching, not asking.');screen.innerHTML=`<div class="brand">AUDIT COMPLETE</div><div class="profile"><b>Here's what we understand</b><p>Handmade leather bags, direct to consumer</p><p>Women 25–40 · Urban · Mid-to-premium</p><p>Lagos · Ships nationwide</p><button class="action" onclick="findings()" style="height:40px">That's right</button></div><div class="finding" id="good"><b>What's working</b><p>Your product photography is genuinely strong — better than 2 of your 3 closest competitors.</p></div><div class="finding fix" id="fix"><b>What needs fixing</b><p>Your Instagram bio link points to a dead page — you're losing every visitor who taps it.</p></div>`;wait(500,()=>document.getElementById('good').classList.add('show'));wait(1600,()=>{document.getElementById('fix').classList.add('show');setCap("We start with what's working. Then we get honest.")});wait(4300,audience)}function audience(){setCap("It already knows who's buying.");screen.innerHTML=`<div class="brand">AUDIENCE</div><div class="audience"><div><div class="pin">📍</div><h2 style="font-family:Sora">Lagos</h2><div class="tags"><span class="tag">Women 25–40</span><span class="tag">Urban</span><span class="tag">Mid-to-premium</span><span class="tag">Ships nationwide</span></div></div></div>`;wait(3600,creative)}function creative(){setCap('Every finding ends in a button.');screen.innerHTML=`<div class="brand">TURN FINDING INTO ACTION</div><div class="creative" id="card"><div class="creative-inner" id="inner"><b>Dead Instagram bio link</b><p>Visitors hit a dead end.</p></div></div>`;wait(1200,()=>{let c=document.getElementById('card');c.classList.add('flip');wait(420,()=>{document.getElementById('inner').innerHTML='<b>Content ready to publish</b><p>✓ Bio link fixed<br>✓ Caption written<br>✓ CTA added<br>✓ Creative prepared</p>';document.getElementById('inner').style.transform='rotateY(180deg)'})});wait(3900,launch)}function launch(){setCap('Then it goes and finds them.');screen.innerHTML=`<div class="brand">LAUNCH</div><div class="launch"><div><div class="icons ray">◎　G　▣</div><div class="counter" id="count">New clicks</div><p>→ New leads → New customers</p></div></div>`;wait(700,()=>document.getElementById('count').textContent='New leads');wait(1500,()=>document.getElementById('count').textContent='New customers');wait(3400,end)}function end(){screen.innerHTML=`<div class="end"><div class="audit-input" style="width:min(100%,520px)"><input placeholder="yourbusiness.com or @yourhandle"><button>Audit</button></div><h1>No second-guessing.<br>No delay.</h1><p>Paste your website or handle. Your customers are already looking.</p><small>Free. 60 seconds. No account needed.</small></div>`;setCap('');progress.style.width='100%'}function restart(){timers.forEach(clearTimeout);timers=[];progress.style.width='0';home()}home();</script></body></html>
