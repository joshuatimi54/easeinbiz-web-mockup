<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Approvals · Easeinbiz</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{border:"hsl(var(--border))",background:"hsl(var(--background))",foreground:"hsl(var(--foreground))",primary:{DEFAULT:"hsl(var(--primary))",foreground:"hsl(var(--primary-foreground))"},muted:{DEFAULT:"hsl(var(--muted))",foreground:"hsl(var(--muted-foreground))"},card:{DEFAULT:"hsl(var(--card))",foreground:"hsl(var(--card-foreground))"}},fontFamily:{display:["Sora","sans-serif"],body:["Inter","sans-serif"]}}}}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/theme.css">
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="font-body antialiased">
<div class="flex h-screen overflow-hidden">
  <div id="sidebar-mount"></div>
  <main class="flex-1 overflow-y-auto min-w-0">
    <div id="topbar-mount"></div>
    <div class="p-3 sm:p-6 max-w-[1600px] mx-auto space-y-5">
      <div id="hdr"></div>
      <div class="eb-card eb-shadow-sm p-0"><div id="appr-table"></div></div>
    </div>
  </main>
</div>
<script src="assets/js/shell.js" data-active="library-approvals" data-title="Approvals"></script>
<script src="assets/js/components.js"></script>
<script>
ebPageHeader('hdr', { title: 'Approvals', subtitle: 'Sharing requests waiting on owner sign-off.' });
ebTable('appr-table', {
  columns: ['Requested item','Requested by','Requested access','Requested on','Action'],
  rows: [
    ['<span class="font-medium">Bluewave Logistics — Brand kit</span>', ebAvatar('TE',6)+' Tunde Eze', ebPill('blue','View'), '3 hours ago', '<div class="flex gap-1.5"><button class="text-xs font-medium px-2.5 py-1 rounded-md text-white" style="background:hsl(160 60% 40%)">Approve</button><button class="text-xs font-medium px-2.5 py-1 rounded-md border" style="border-color:hsl(var(--border))">Deny</button></div>'],
    ['<span class="font-medium">Q3_media_kit.pdf</span>', ebAvatar('MO',6)+' Maya Okoye', ebPill('green','Edit'), 'Yesterday', '<div class="flex gap-1.5"><button class="text-xs font-medium px-2.5 py-1 rounded-md text-white" style="background:hsl(160 60% 40%)">Approve</button><button class="text-xs font-medium px-2.5 py-1 rounded-md border" style="border-color:hsl(var(--border))">Deny</button></div>'],
  ]
});
</script>
</body>
</html>
