<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payroll Dashboard · Easeinbiz</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{border:"hsl(var(--border))",background:"hsl(var(--background))",foreground:"hsl(var(--foreground))",primary:{DEFAULT:"hsl(var(--primary))",foreground:"hsl(var(--primary-foreground))"},muted:{DEFAULT:"hsl(var(--muted))",foreground:"hsl(var(--muted-foreground))"},card:{DEFAULT:"hsl(var(--card))",foreground:"hsl(var(--card-foreground))"}},fontFamily:{display:["Sora","sans-serif"],body:["Inter","sans-serif"]}}}}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/theme.css">
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="font-body antialiased">
<div class="flex h-screen overflow-hidden">
  <div id="sidebar-mount"></div>
  <main class="flex-1 overflow-y-auto min-w-0">
    <div id="topbar-mount"></div>
    <div class="p-3 sm:p-6 max-w-[1600px] mx-auto space-y-5">
      <div id="hdr"></div>
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-5">
        <div class="eb-card eb-shadow-sm p-5">
          <h3 class="font-display font-semibold text-[15px] mb-4">Payroll cost, last 6 months</h3>
          <div class="h-48 rounded-lg skeleton-chart flex items-end gap-3 p-3">
            <div class="flex-1 rounded-t" style="height:70%;background:hsl(var(--primary)/.6)"></div>
            <div class="flex-1 rounded-t" style="height:74%;background:hsl(var(--primary)/.6)"></div>
            <div class="flex-1 rounded-t" style="height:78%;background:hsl(var(--primary)/.6)"></div>
            <div class="flex-1 rounded-t" style="height:82%;background:hsl(var(--primary)/.6)"></div>
            <div class="flex-1 rounded-t" style="height:90%;background:hsl(var(--primary))"></div>
            <div class="flex-1 rounded-t" style="height:96%;background:hsl(var(--primary))"></div>
          </div>
        </div>
        <div class="eb-card eb-shadow-sm p-5">
          <h3 class="font-display font-semibold text-[15px] mb-4">Headcount by department</h3>
          <div class="space-y-3">
            <div><div class="flex justify-between text-xs mb-1"><span>Marketing</span><span class="text-muted-foreground">7</span></div><div class="progress-track h-1.5"><div class="progress-fill" style="width:39%"></div></div></div>
            <div><div class="flex justify-between text-xs mb-1"><span>Operations</span><span class="text-muted-foreground">5</span></div><div class="progress-track h-1.5"><div class="progress-fill" style="width:28%;background:hsl(var(--accent))"></div></div></div>
            <div><div class="flex justify-between text-xs mb-1"><span>Design</span><span class="text-muted-foreground">3</span></div><div class="progress-track h-1.5"><div class="progress-fill" style="width:17%;background:hsl(160 60% 45%)"></div></div></div>
            <div><div class="flex justify-between text-xs mb-1"><span>Finance & Admin</span><span class="text-muted-foreground">3</span></div><div class="progress-track h-1.5"><div class="progress-fill" style="width:17%;background:hsl(280 60% 55%)"></div></div></div>
          </div>
        </div>
      </div>
      <div class="eb-card eb-shadow-sm p-5">
        <h3 class="font-display font-semibold text-[15px] mb-4">Compliance & deductions summary — August</h3>
        <div id="kpis"></div>
      </div>
    </div>
  </main>
</div>
<script src="assets/js/shell.js" data-active="payroll-dashboard" data-title="Payroll Dashboard"></script>
<script src="assets/js/components.js"></script>
<script>
ebPageHeader('hdr', { title: 'Payroll Dashboard', subtitle: 'Cost trends, headcount, and compliance at a glance.' });
ebKpi('kpis', [
  { icon:'landmark', label:'PAYE remitted', value:'₦980,000', iconBg:'#E8F4FA', iconFg:'#0077B5' },
  { icon:'shield-check', label:'Pension (8%)', value:'₦499,200', iconBg:'#E1F5EC', iconFg:'#0FA36B' },
  { icon:'home', label:'NHF (2.5%)', value:'₦156,000', iconBg:'#FFF6E5', iconFg:'#7A4E00' },
]);
</script>
</body>
</html>
