<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in · Easeinbiz</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{border:"hsl(var(--border))",background:"hsl(var(--background))",foreground:"hsl(var(--foreground))",primary:{DEFAULT:"hsl(var(--primary))",foreground:"hsl(var(--primary-foreground))"},card:{DEFAULT:"hsl(var(--card))",foreground:"hsl(var(--card-foreground))"}},fontFamily:{display:["Sora","sans-serif"],body:["Inter","sans-serif"]}}}}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/theme.css">
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="font-body antialiased">
  <div class="flex min-h-screen">
    <div class="flex w-full lg:w-1/2 flex-col items-center justify-center px-6 py-12">
      <div class="w-full max-w-sm space-y-6">
        <div class="flex items-center gap-2 mb-2">
          <div class="h-8 w-8 rounded-lg flex items-center justify-center" style="background:hsl(var(--primary))"><span class="text-white font-extrabold text-sm">E</span></div>
          <span class="font-display font-extrabold text-base">Easeinbiz</span>
        </div>
        <div>
          <h1 class="font-display text-2xl font-bold">Welcome back</h1>
          <p class="text-sm text-muted-foreground mt-1">Log in to manage your operations.</p>
        </div>
        <div class="space-y-3">
          <div><label class="text-xs font-medium mb-1.5 block">Email</label><input class="w-full text-sm border rounded-md px-3 py-2.5" style="border-color:hsl(var(--border))" placeholder="you@company.com"></div>
          <div>
            <div class="flex items-center justify-between mb-1.5"><label class="text-xs font-medium">Password</label><a href="forgot-password.html" class="text-xs font-medium" style="color:hsl(var(--primary))">Forgot?</a></div>
            <input type="password" class="w-full text-sm border rounded-md px-3 py-2.5" style="border-color:hsl(var(--border))" placeholder="••••••••">
          </div>
          <a href="dashboard-overview.html" class="w-full text-sm font-medium rounded-md text-white py-2.5 flex items-center justify-center" style="background:hsl(var(--primary))">Log in</a>
        </div>
        <div class="relative text-center"><span class="text-xs text-muted-foreground bg-white px-2 relative z-10">or</span><div class="absolute top-1/2 left-0 right-0 h-px" style="background:hsl(var(--border))"></div></div>
        <button class="w-full text-sm font-medium rounded-md border py-2.5 flex items-center justify-center gap-2" style="border-color:hsl(var(--border))"><i data-lucide="chrome" class="h-4 w-4"></i>Continue with Google</button>
        <p class="text-center text-sm text-muted-foreground">Don't have an account? <a href="signup.html" class="font-medium" style="color:hsl(var(--primary))">Sign up</a></p>
      </div>
    </div>
    <div class="hidden lg:flex lg:w-1/2 relative overflow-hidden" style="background:linear-gradient(135deg,#0F2A38,#0077B5 70%)">
      <div class="relative z-10 flex flex-col justify-end p-12 text-white">
        <p class="font-display text-3xl font-bold leading-tight max-w-md">Run your agency's tasks, content, finance, and payroll — all in one place.</p>
        <p class="text-sm opacity-80 mt-4 max-w-md">Trusted by growth agencies and creative studios managing 100+ client accounts.</p>
      </div>
    </div>
  </div>
  <script>if (window.lucide) lucide.createIcons();</script>
</body>
</html>
