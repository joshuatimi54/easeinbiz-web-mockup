<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Q4 Campaign Ideas · Easeinbiz</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{border:"hsl(var(--border))",background:"hsl(var(--background))",foreground:"hsl(var(--foreground))",primary:{DEFAULT:"hsl(var(--primary))",foreground:"hsl(var(--primary-foreground))"},muted:{DEFAULT:"hsl(var(--muted))",foreground:"hsl(var(--muted-foreground))"},card:{DEFAULT:"hsl(var(--card))",foreground:"hsl(var(--card-foreground))"}},fontFamily:{display:["Sora","sans-serif"],body:["Inter","sans-serif"]}}}}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/theme.css">
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="font-body antialiased">
<div class="flex h-screen overflow-hidden">
  <div id="sidebar-mount"></div>
  <main class="flex-1 overflow-y-auto min-w-0">
    <div id="topbar-mount"></div>
    <div class="p-3 sm:p-6 max-w-[1400px] mx-auto space-y-5">
      <a href="lab.html" class="inline-flex items-center gap-1.5 text-sm text-muted-foreground hover:text-foreground"><i data-lucide="arrow-left" class="h-3.5 w-3.5"></i>The Lab</a>
      <div class="flex items-center justify-between flex-wrap gap-3">
        <h1 class="text-xl font-bold tracking-tight font-display">Q4 Campaign Ideas</h1>
        <button class="inline-flex items-center gap-1.5 rounded-md text-white text-sm font-medium px-3.5 py-2" style="background:hsl(var(--primary))"><i data-lucide="plus" class="h-4 w-4"></i>Add Idea Card</button>
      </div>
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4" id="cards"></div>
    </div>
  </main>
</div>
<script src="assets/js/shell.js" data-active="lab" data-title="Notebook"></script>
<script>
var cards = [
  { title:'Holiday gift guide series', note:'5-part carousel series featuring client products, one per week through December.', tag:'Content' },
  { title:'Referral double-reward week', note:'Both referrer and referee get 2x rewards for one week — pasted from a competitor teardown.', tag:'Growth' },
  { title:'Year-in-review email', note:'Personalized wrap-up email per client showing their 2026 growth stats.', tag:'Email' },
  { title:'Livestream Q&A with founders', note:'', tag:'Events' },
  { title:'Partner co-marketing push', note:'Cross-promote with 2-3 complementary local brands.', tag:'Partnerships' },
];
document.getElementById('cards').innerHTML = cards.map(function (c) {
  return '<div class="eb-card eb-shadow-sm p-4">' +
    '<span class="chip text-[10px] py-0.5 mb-3 inline-block">' + c.tag + '</span>' +
    '<p class="text-sm font-medium mb-1">' + c.title + '</p>' +
    (c.note ? '<p class="text-xs text-muted-foreground leading-relaxed">' + c.note + '</p>' : '') +
    '</div>';
}).join('') + '<div class="rounded-lg border-2 border-dashed flex items-center justify-center text-sm text-muted-foreground py-10 cursor-pointer" style="border-color:hsl(var(--border))"><i data-lucide="plus" class="h-4 w-4 mr-1.5"></i>New idea card</div>';
if (window.lucide) lucide.createIcons();
</script>
</body>
</html>
