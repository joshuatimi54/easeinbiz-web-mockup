<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Configure Payroll · Easeinbiz</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{border:"hsl(var(--border))",background:"hsl(var(--background))",foreground:"hsl(var(--foreground))",primary:{DEFAULT:"hsl(var(--primary))",foreground:"hsl(var(--primary-foreground))"},muted:{DEFAULT:"hsl(var(--muted))",foreground:"hsl(var(--muted-foreground))"},card:{DEFAULT:"hsl(var(--card))",foreground:"hsl(var(--card-foreground))"}},fontFamily:{display:["Sora","sans-serif"],body:["Inter","sans-serif"]}}}}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/theme.css">
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="font-body antialiased">
<div class="flex h-screen overflow-hidden">
  <div id="sidebar-mount"></div>
  <main class="flex-1 overflow-y-auto min-w-0">
    <div id="topbar-mount"></div>
    <div class="p-3 sm:p-6 max-w-3xl mx-auto space-y-5">
      <div>
        <h1 class="text-[26px] font-bold tracking-tight font-display">Configure Payroll</h1>
        <p class="text-sm text-muted-foreground mt-1">Set statutory rates and pay run defaults for your organization.</p>
      </div>

      <div class="eb-card eb-shadow-sm p-6 space-y-5">
        <h3 class="font-display font-semibold text-sm">Pay schedule</h3>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div><label class="text-xs font-medium mb-1.5 block">Pay frequency</label><select class="w-full text-sm border rounded-md px-3 py-2" style="border-color:hsl(var(--border))"><option>Monthly</option><option>Bi-weekly</option></select></div>
          <div><label class="text-xs font-medium mb-1.5 block">Pay day</label><select class="w-full text-sm border rounded-md px-3 py-2" style="border-color:hsl(var(--border))"><option>Last business day</option><option>25th</option><option>28th</option></select></div>
        </div>
      </div>

      <div class="eb-card eb-shadow-sm p-6 space-y-5">
        <h3 class="font-display font-semibold text-sm">Statutory deductions (2026 NTA)</h3>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div><label class="text-xs font-medium mb-1.5 block">PAYE exemption threshold</label><input class="w-full text-sm border rounded-md px-3 py-2" style="border-color:hsl(var(--border))" value="₦800,000 / year"></div>
          <div><label class="text-xs font-medium mb-1.5 block">Rent relief cap</label><input class="w-full text-sm border rounded-md px-3 py-2" style="border-color:hsl(var(--border))" value="₦500,000 / year"></div>
          <div><label class="text-xs font-medium mb-1.5 block">Pension — employee</label><input class="w-full text-sm border rounded-md px-3 py-2" style="border-color:hsl(var(--border))" value="8%"></div>
          <div><label class="text-xs font-medium mb-1.5 block">Pension — employer</label><input class="w-full text-sm border rounded-md px-3 py-2" style="border-color:hsl(var(--border))" value="10%"></div>
          <div><label class="text-xs font-medium mb-1.5 block">NHF rate</label><input class="w-full text-sm border rounded-md px-3 py-2" style="border-color:hsl(var(--border))" value="2.5%"></div>
        </div>
      </div>

      <div class="eb-card eb-shadow-sm p-6 space-y-4">
        <h3 class="font-display font-semibold text-sm">Disbursement</h3>
        <div class="flex items-center justify-between">
          <div><p class="text-sm font-medium">Paystack bulk transfer</p><p class="text-xs text-muted-foreground">Auto-disburse net pay to employee bank accounts</p></div>
          <button class="w-10 h-5.5 rounded-full relative" style="background:hsl(var(--primary))"><span class="absolute top-0.5 right-0.5 h-4.5 w-4.5 rounded-full bg-white"></span></button>
        </div>
      </div>

      <div class="flex justify-end"><button class="text-sm font-medium px-4 py-2 rounded-md text-white" style="background:hsl(var(--primary))">Save Configuration</button></div>
    </div>
  </main>
</div>
<script src="assets/js/shell.js" data-active="payroll-config" data-title="Configure Payroll"></script>
</body>
</html>
