<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forms · Easeinbiz</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{border:"hsl(var(--border))",background:"hsl(var(--background))",foreground:"hsl(var(--foreground))",primary:{DEFAULT:"hsl(var(--primary))",foreground:"hsl(var(--primary-foreground))"},muted:{DEFAULT:"hsl(var(--muted))",foreground:"hsl(var(--muted-foreground))"},card:{DEFAULT:"hsl(var(--card))",foreground:"hsl(var(--card-foreground))"}},fontFamily:{display:["Sora","sans-serif"],body:["Inter","sans-serif"]}}}}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/theme.css">
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="font-body antialiased">
<div class="flex h-screen overflow-hidden">
  <div id="sidebar-mount"></div>
  <main class="flex-1 overflow-y-auto min-w-0">
    <div id="topbar-mount"></div>
    <div class="p-3 sm:p-6 max-w-[1600px] mx-auto space-y-5">
      <div id="hdr"></div>
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4" id="form-cards"></div>
    </div>
  </main>
</div>
<script src="assets/js/shell.js" data-active="forms" data-title="Forms"></script>
<script src="assets/js/components.js"></script>
<script>
ebPageHeader('hdr', { title: 'Forms', subtitle: 'Collect leads, feedback, and intake info with shareable forms.', actions: [{ label: 'New Form', icon: 'plus', primary: true, href:'forms-builder.html' }] });
var forms = [
  { name: 'Client Intake Questionnaire', responses: 84, status: 'green', statusLabel: 'Live', updated: 'Updated 2 days ago' },
  { name: 'Discovery Call Booking', responses: 41, status: 'green', statusLabel: 'Live', updated: 'Updated 1 week ago' },
  { name: 'Customer Satisfaction Survey', responses: 128, status: 'green', statusLabel: 'Live', updated: 'Updated 3 days ago' },
  { name: 'App Feedback', responses: 19, status: 'gray', statusLabel: 'Draft', updated: 'Edited today' },
];
document.getElementById('form-cards').innerHTML = forms.map(function (f) {
  return '<a href="forms-responses.html" class="eb-card eb-shadow-sm p-5 block hover:shadow transition-all">' +
    '<div class="flex items-start justify-between mb-3"><div class="h-9 w-9 rounded-lg flex items-center justify-center" style="background:#E8F4FA"><i data-lucide="clipboard-list" class="h-4 w-4" style="color:#0077B5"></i></div>' + ebPill(f.status, f.statusLabel) + '</div>' +
    '<p class="font-display font-semibold text-sm mb-1">' + f.name + '</p>' +
    '<p class="text-xs text-muted-foreground mb-4">' + f.updated + '</p>' +
    '<div class="flex items-center justify-between text-xs border-t pt-3" style="border-color:hsl(var(--border))">' +
      '<span class="text-muted-foreground">' + f.responses + ' responses</span>' +
      '<span class="font-medium" style="color:hsl(var(--primary))">View →</span>' +
    '</div></a>';
}).join('');
if (window.lucide) lucide.createIcons();
</script>
</body>
</html>
