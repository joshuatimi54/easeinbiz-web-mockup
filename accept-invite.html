<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Accept invite · Easeinbiz</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{border:"hsl(var(--border))",background:"hsl(var(--background))",foreground:"hsl(var(--foreground))",primary:{DEFAULT:"hsl(var(--primary))",foreground:"hsl(var(--primary-foreground))"},card:{DEFAULT:"hsl(var(--card))",foreground:"hsl(var(--card-foreground))"}},fontFamily:{display:["Sora","sans-serif"],body:["Inter","sans-serif"]}}}}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/theme.css">
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="font-body antialiased">
  <div class="min-h-screen flex flex-col items-center justify-center px-6">
    <div class="w-full max-w-sm space-y-6">
      <div class="flex items-center gap-2 justify-center mb-2"><div class="h-8 w-8 rounded-lg flex items-center justify-center" style="background:hsl(var(--primary))"><span class="text-white font-extrabold text-sm">E</span></div><span class="font-display font-extrabold text-base">Easeinbiz</span></div>
      <div class="eb-card eb-shadow p-8 space-y-5 text-center">
        <div class="h-12 w-12 rounded-full flex items-center justify-center mx-auto" style="background:hsl(var(--sidebar-accent))"><i data-lucide="mail" class="h-5 w-5" style="color:hsl(var(--primary))"></i></div>
        <div>
          <h1 class="font-display text-xl font-bold">You've been invited</h1>
          <p class="text-sm text-muted-foreground mt-1"><span class="font-medium text-foreground">Josh Adesoba</span> invited you to join <span class="font-medium text-foreground">Acme Growth Agency</span> as a <span class="font-medium text-foreground">Staff</span> member.</p>
        </div>
        <div class="space-y-3 text-left">
          <div><label class="text-xs font-medium mb-1.5 block">Full name</label><input class="w-full text-sm border rounded-md px-3 py-2.5" style="border-color:hsl(var(--border))" placeholder="Your name"></div>
          <div><label class="text-xs font-medium mb-1.5 block">Password</label><input type="password" class="w-full text-sm border rounded-md px-3 py-2.5" style="border-color:hsl(var(--border))" placeholder="Create a password"></div>
        </div>
        <a href="dashboard-overview.html" class="w-full text-sm font-medium rounded-md text-white py-2.5 flex items-center justify-center" style="background:hsl(var(--primary))">Accept & Join</a>
      </div>
    </div>
  </div>
  <script>if (window.lucide) lucide.createIcons();</script>
</body>
</html>
