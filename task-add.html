<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Task · Easeinbiz</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{border:"hsl(var(--border))",background:"hsl(var(--background))",foreground:"hsl(var(--foreground))",primary:{DEFAULT:"hsl(var(--primary))",foreground:"hsl(var(--primary-foreground))"},muted:{DEFAULT:"hsl(var(--muted))",foreground:"hsl(var(--muted-foreground))"},card:{DEFAULT:"hsl(var(--card))",foreground:"hsl(var(--card-foreground))"}},fontFamily:{display:["Sora","sans-serif"],body:["Inter","sans-serif"]}}}}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/theme.css">
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="font-body antialiased">
<div class="flex h-screen overflow-hidden">
  <div id="sidebar-mount"></div>
  <main class="flex-1 overflow-y-auto min-w-0">
    <div id="topbar-mount"></div>
    <div class="p-3 sm:p-6 max-w-3xl mx-auto space-y-6">
      <a href="tasks.html" class="inline-flex items-center gap-1.5 text-sm text-muted-foreground hover:text-foreground"><i data-lucide="arrow-left" class="h-3.5 w-3.5"></i>Back to Tasks</a>
      <div>
        <h1 class="text-[26px] font-bold tracking-tight font-display">New Task</h1>
        <p class="text-sm text-muted-foreground mt-1">Assign work to your team with due dates and priority.</p>
      </div>

      <div class="eb-card eb-shadow-sm p-6 space-y-5">
        <div>
          <label class="text-xs font-medium mb-1.5 block">Title</label>
          <input class="w-full text-sm border rounded-md px-3 py-2" style="border-color:hsl(var(--border))" placeholder="e.g. Draft Q3 social calendar for Acme Retail">
        </div>
        <div>
          <label class="text-xs font-medium mb-1.5 block">Description</label>
          <textarea rows="4" class="w-full text-sm border rounded-md px-3 py-2" style="border-color:hsl(var(--border))" placeholder="Add context, links, or checklist items..."></textarea>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="text-xs font-medium mb-1.5 block">Assignee</label>
            <select class="w-full text-sm border rounded-md px-3 py-2" style="border-color:hsl(var(--border))"><option>Maya Okoye</option><option>Josh Adesoba</option><option>Tunde Eze</option></select>
          </div>
          <div>
            <label class="text-xs font-medium mb-1.5 block">Priority</label>
            <select class="w-full text-sm border rounded-md px-3 py-2" style="border-color:hsl(var(--border))"><option>Medium</option><option>Low</option><option>High</option><option>Urgent</option></select>
          </div>
          <div>
            <label class="text-xs font-medium mb-1.5 block">Due date</label>
            <input type="date" class="w-full text-sm border rounded-md px-3 py-2" style="border-color:hsl(var(--border))">
          </div>
          <div>
            <label class="text-xs font-medium mb-1.5 block">Status</label>
            <select class="w-full text-sm border rounded-md px-3 py-2" style="border-color:hsl(var(--border))"><option>To Do</option><option>In Progress</option><option>In Review</option><option>Done</option></select>
          </div>
          <div>
            <label class="text-xs font-medium mb-1.5 block">Related company</label>
            <select class="w-full text-sm border rounded-md px-3 py-2" style="border-color:hsl(var(--border))"><option>None</option><option>Acme Retail Co.</option><option>Bluewave Logistics</option></select>
          </div>
          <div>
            <label class="text-xs font-medium mb-1.5 block">Tag</label>
            <select class="w-full text-sm border rounded-md px-3 py-2" style="border-color:hsl(var(--border))"><option>Content</option><option>Ads</option><option>Design</option><option>Analytics</option><option>Client</option></select>
          </div>
        </div>
        <div class="flex items-center justify-end gap-2 pt-2 border-t" style="border-color:hsl(var(--border))">
          <a href="tasks.html" class="text-sm font-medium px-4 py-2 rounded-md border hover:bg-muted" style="border-color:hsl(var(--border))">Cancel</a>
          <a href="tasks.html" class="text-sm font-medium px-4 py-2 rounded-md text-white" style="background:hsl(var(--primary))">Create Task</a>
        </div>
      </div>
    </div>
  </main>
</div>
<script src="assets/js/shell.js" data-active="tasks" data-title="New Task"></script>
</body>
</html>
