<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Automation Builder · Easeinbiz</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{border:"hsl(var(--border))",background:"hsl(var(--background))",foreground:"hsl(var(--foreground))",primary:{DEFAULT:"hsl(var(--primary))",foreground:"hsl(var(--primary-foreground))"},muted:{DEFAULT:"hsl(var(--muted))",foreground:"hsl(var(--muted-foreground))"},card:{DEFAULT:"hsl(var(--card))",foreground:"hsl(var(--card-foreground))"}},fontFamily:{display:["Sora","sans-serif"],body:["Inter","sans-serif"]}}}}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/theme.css">
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="font-body antialiased">
<div class="flex h-screen overflow-hidden">
  <div id="sidebar-mount"></div>
  <main class="flex-1 overflow-y-auto min-w-0">
    <div id="topbar-mount"></div>
    <div class="p-3 sm:p-6 max-w-3xl mx-auto space-y-5">
      <a href="automations.html" class="inline-flex items-center gap-1.5 text-sm text-muted-foreground hover:text-foreground"><i data-lucide="arrow-left" class="h-3.5 w-3.5"></i>Automations</a>
      <h1 class="text-xl font-bold tracking-tight font-display">New Automation</h1>

      <div class="eb-card eb-shadow-sm p-5">
        <div>
          <label class="text-xs font-medium mb-1.5 block">Name</label>
          <input class="w-full text-sm border rounded-md px-3 py-2" style="border-color:hsl(var(--border))" placeholder="e.g. Welcome new leads">
        </div>
      </div>

      <div class="relative pl-8">
        <div class="absolute left-3 top-2 bottom-2 w-px" style="background:hsl(var(--border))"></div>

        <div class="relative mb-4">
          <div class="absolute -left-8 top-3 h-6 w-6 rounded-full flex items-center justify-center text-white text-[11px] font-bold" style="background:hsl(var(--primary))">1</div>
          <div class="eb-card eb-shadow-sm p-5">
            <p class="text-xs font-semibold text-muted-foreground uppercase mb-2">Trigger</p>
            <select class="w-full text-sm border rounded-md px-3 py-2" style="border-color:hsl(var(--border))">
              <option>When a lead is created</option>
              <option>When content is submitted for approval</option>
              <option>When an invoice becomes overdue</option>
              <option>When a task is overdue</option>
            </select>
          </div>
        </div>

        <div class="relative">
          <div class="absolute -left-8 top-3 h-6 w-6 rounded-full flex items-center justify-center text-white text-[11px] font-bold" style="background:hsl(var(--accent))">2</div>
          <div class="eb-card eb-shadow-sm p-5 space-y-3">
            <p class="text-xs font-semibold text-muted-foreground uppercase mb-1">Action</p>
            <select class="w-full text-sm border rounded-md px-3 py-2" style="border-color:hsl(var(--border))">
              <option>Send an email</option>
              <option>Send a Slack notification</option>
              <option>Assign to a team member</option>
              <option>Add a tag</option>
            </select>
            <input class="w-full text-sm border rounded-md px-3 py-2" style="border-color:hsl(var(--border))" placeholder="Recipient / channel">
          </div>
        </div>
      </div>

      <div class="flex justify-end gap-2">
        <button class="text-sm font-medium px-4 py-2 rounded-md border hover:bg-muted" style="border-color:hsl(var(--border))">Cancel</button>
        <button class="text-sm font-medium px-4 py-2 rounded-md text-white" style="background:hsl(var(--primary))">Save Automation</button>
      </div>
    </div>
  </main>
</div>
<script src="assets/js/shell.js" data-active="automations" data-title="Automation Builder"></script>
</body>
</html>
