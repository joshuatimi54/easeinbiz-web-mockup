<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expenses · Easeinbiz</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{border:"hsl(var(--border))",background:"hsl(var(--background))",foreground:"hsl(var(--foreground))",primary:{DEFAULT:"hsl(var(--primary))",foreground:"hsl(var(--primary-foreground))"},muted:{DEFAULT:"hsl(var(--muted))",foreground:"hsl(var(--muted-foreground))"},card:{DEFAULT:"hsl(var(--card))",foreground:"hsl(var(--card-foreground))"}},fontFamily:{display:["Sora","sans-serif"],body:["Inter","sans-serif"]}}}}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/theme.css">
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="font-body antialiased">
<div class="flex h-screen overflow-hidden">
  <div id="sidebar-mount"></div>
  <main class="flex-1 overflow-y-auto min-w-0">
    <div id="topbar-mount"></div>
    <div class="p-3 sm:p-6 max-w-[1600px] mx-auto space-y-5">
      <div id="hdr"></div>
      <div class="flex items-center gap-2 text-xs border-b eb-scroll-x" style="border-color:hsl(var(--border))">
        <a href="finance-sales.html" class="px-3 py-2 border-b-2 border-transparent text-muted-foreground whitespace-nowrap">Sales Records</a>
        <a href="finance-expenses.html" class="px-3 py-2 border-b-2 font-medium whitespace-nowrap" style="border-color:hsl(var(--primary));color:hsl(var(--primary))">Expenses</a>
        <a href="finance-invoices.html" class="px-3 py-2 border-b-2 border-transparent text-muted-foreground whitespace-nowrap">Invoices</a>
      </div>
      <div class="flex items-center justify-between flex-wrap gap-3">
        <div class="flex items-center gap-2">
          <select class="text-xs border rounded-md px-2.5 py-1.5" style="border-color:hsl(var(--border))"><option>All categories</option><option>Software & tools</option><option>Ad spend</option><option>Contractors</option><option>Office</option></select>
        </div>
        <button class="inline-flex items-center gap-1.5 rounded-md text-white text-sm font-medium px-3.5 py-2" style="background:hsl(var(--primary))"><i data-lucide="plus" class="h-4 w-4"></i>Add Expense</button>
      </div>
      <div class="eb-card eb-shadow-sm p-0"><div id="exp-table"></div></div>
    </div>
  </main>
</div>
<script src="assets/js/shell.js" data-active="finance-expenses" data-title="Expenses"></script>
<script src="assets/js/components.js"></script>
<script>
ebPageHeader('hdr', { title: 'Finance', subtitle: 'Sales, expenses, and invoicing for your organization.' });
ebTable('exp-table', {
  columns: ['Date','Description','Category','Vendor','Amount'],
  rows: [
    ['Aug 1, 2026', 'Meta Ads — Acme campaign', ebPill('purple','Ad spend'), 'Meta Platforms', '<span class="font-medium">₦240,000</span>'],
    ['Jul 28, 2026', 'Canva Pro annual plan', ebPill('blue','Software & tools'), 'Canva', '<span class="font-medium">₦86,500</span>'],
    ['Jul 25, 2026', 'Freelance video editor — July', ebPill('orange','Contractors'), 'Ibrahim S.', '<span class="font-medium">₦150,000</span>'],
    ['Jul 20, 2026', 'Office internet & utilities', ebPill('gray','Office'), 'MTN Business', '<span class="font-medium">₦45,000</span>'],
    ['Jul 15, 2026', 'Google Ads — Bluewave campaign', ebPill('purple','Ad spend'), 'Google', '<span class="font-medium">₦310,000</span>'],
  ]
});
</script>
</body>
</html>
